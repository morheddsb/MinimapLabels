# Pushing a tag like v0.1.0 builds the zip with tools/package.sh and publishes
# it as a GitHub release, which the WowUp Hub picks up.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches TOC version
        run: |
          version=$(sed -n 's/^## Version:[[:space:]]*//p' MinimapLabels.toc | tr -d '\r')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version $version" >&2
            exit 1
          fi

      - name: Build zip
        id: build
        run: echo "zip=$(sh tools/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --title "$GITHUB_REF_NAME" --generate-notes
